<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Landingpage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <img src="arrow.png" class="arrow" alt="Pfeil">
    <p class="text">Tippe auf die drei Punkte ⋯ oben rechts und öffne im Browser</p>
  </div>

  <script src="config.js"></script>
  <script>
    const ua = navigator.userAgent.toLowerCase();
    const isTikTok = ua.includes("tiktok");

    if (!isTikTok) {
      // Nur im echten Browser weiterleiten
      window.location.href = FANVUE_URL;
    }
    // Wenn TikTok → nichts tun, Landingpage bleibt sichtbar
  </script>

</body>
</html>
